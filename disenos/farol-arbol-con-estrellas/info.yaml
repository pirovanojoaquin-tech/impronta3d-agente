nombre: Farol árbol con estrellas
descripcion: Arbolito farol de 19 cm, hueco y con estrellitas caladas. Le ponés una vela LED adentro y proyecta estrellas de luz en la mesa y la pared. Estrella dorada en la punta.
inspiracion: Los faroles de árbol calados que se venden en tiendas de deco para las fiestas. Diseño propio en 2 colores (AMS).
piezas:
