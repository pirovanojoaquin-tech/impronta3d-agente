nombre: Casita farol nevada
descripcion: Casita de 8 cm con techo nevado y ventanas caladas. Con una vela LED adentro, la luz sale por las ventanas y la puerta. Armá un pueblito con varias en la repisa o la mesa.
inspiracion: Las casitas iluminadas de los pueblitos navideños. Diseño propio en 2 colores (AMS).
